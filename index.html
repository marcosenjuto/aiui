<!doctype html><meta charset="utf-8"><title>aiui demo</title>
<style>body{font:16px system-ui;max-width:720px;margin:2rem auto;padding:0 16px}iframe{width:100%;height:320px;border:1px solid #ccc}</style>
<h1>aiui</h1>
<textarea id="prompt" rows="3" style="width:100%">Tabla de ventas con filtro por texto</textarea>
<p><select id="prov"><option value="chrome">Chrome (local)</option><option value="or">OpenRouter</option></select>
<input id="key" placeholder="API key (solo en tu navegador)" type="password">
<input id="model" placeholder="modelo, ej. anthropic/claude-sonnet-4.5">
<button id="go">Generar</button></p>
<pre id="log"></pre><div id="out"></div>
<script type="module">
import { chromeProvider, openAICompatibleProvider, runComponent } from './src/index.js';
const datasets = { sales: [{ producto: 'A', total: 120 }, { producto: 'B', total: 80 }] };
const capabilities = { getData: async ({ dataset }) => {
  if (!Object.hasOwn(datasets, dataset)) throw new Error('Dataset no autorizado');
  return structuredClone(datasets[dataset]);
} };
const log = (m) => document.getElementById('log').textContent = m;
let current;
go.onclick = async () => {
  try {
    const p = prov.value === 'chrome' ? chromeProvider()
      : openAICompatibleProvider({ apiKey: key.value, model: model.value });
    if (!(await p.isAvailable())) return log('Proveedor no disponible');
    const { code } = await p.generateComponent({ prompt: prompt.value });
    current?.destroy();
    current = runComponent({ code, container: out, capabilities, onError: (e) => log(e.message) });
    log('OK');
  } catch (e) { log(e.message); }
};
</script>
